[workspace.package]
version = "1.0.0"
edition = "2024"
authors = ["GOLIA K.K."]
license = "MIT OR Apache-2.0"
repository = "https://github.com/goliajp/gnet"
homepage = "https://github.com/goliajp/gnet"

[workspace]
resolver = "2"
members = [
    "crates/gnet",
    "crates/gnet-bench-compare",
    "crates/gnet-config",
    "crates/gnet-console",
    "crates/gnet-console-schema",
    "crates/gnet-crypto",
    "crates/gnet-discover",
    "crates/gnet-discover-schema",
    "crates/gnet-hex",
    "crates/gnet-noise",
    "crates/gnet-punch",
    "crates/gnet-rand",
    "crates/gnet-relay",
    "crates/gnet-relay-server",
    "crates/gnet-tun",
    "crates/gnet-wire",
]

[workspace.dependencies]
# Internal crates — `path` resolves locally during development; `version`
# kicks in at `cargo publish` time (Cargo strips `path` and keeps `version`
# in the uploaded manifest). One workspace.version bump cascades to every
# internal dep edge through these declarations.
gnet-config = { path = "crates/gnet-config", version = "1.0.0" }
gnet-console-schema = { path = "crates/gnet-console-schema", version = "1.0.0" }
gnet-crypto = { path = "crates/gnet-crypto", version = "1.0.0" }
gnet-discover-schema = { path = "crates/gnet-discover-schema", version = "1.0.0" }
gnet-hex = { path = "crates/gnet-hex", version = "1.0.0" }
gnet-noise = { path = "crates/gnet-noise", version = "1.0.0" }
gnet-punch = { path = "crates/gnet-punch", version = "1.0.0" }
gnet-rand = { path = "crates/gnet-rand", version = "1.0.0" }
gnet-relay = { path = "crates/gnet-relay", version = "1.0.0" }
gnet-tun = { path = "crates/gnet-tun", version = "1.0.0" }
gnet-wire = { path = "crates/gnet-wire", version = "1.0.0" }

# External crates — kept to the minimum the control-plane (gnet-discover)
# and the cross-ecosystem bench harness (gnet-bench-compare) need. The
# overlay's data-plane crates stay 0-dep by policy.
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httparse = "1"
thiserror = "2"
tracing = "0.1"
# bench-compare only — SOTA Rust competitors put numbers next to ours.
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
snow = "0.10"

# gnet-console only — v1.1 control-plane backend. Strictly walled off from
# the data-plane crates: nothing here may appear in `crates/gnet/Cargo.toml`
# or its transitive deps. The cargo publish --dry-run check on the leaf
# stones guards this (see crates/PUBLISH.md).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
sqlx = { version = "0.8", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Argon2id for local-admin password hashing (plan §11). Parameters live in
# a single constant in `gnet-discover/src/admin/auth.rs`; bump in one place.
argon2 = "0.5"
# RFC 3339 / timestamptz friendly time type — sqlx already accepts
# chrono::DateTime<Utc> against `TIMESTAMPTZ` columns via this feature.
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
# Valkey client (RESP-compatible). connection-manager gives us a single
# multiplexed connection with automatic reconnect — plenty for the
# dispatcher's session / federation-cache workload.
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
# Cookie jar + Set-Cookie helpers on top of axum. cookie feature transitively
# pulls the `cookie` crate; we reach for SameSite / Cookie through axum-extra
# re-exports so there's only one cookie crate version in the tree.
axum-extra = { version = "0.10", default-features = false, features = ["cookie"] }
# `time::Duration` for cookie max-age. cookie 0.18 uses time 0.3 internally;
# pinning the version here keeps the dep tree consistent.
time = { version = "0.3", default-features = false }
# OAuth provider HTTP calls (Google / GitHub / Apple). rustls-tls so we
# don't pull OpenSSL; json so the body decoders are right there.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Apple Sign-In ID-token verify (ES256) + client_secret JWT signing.
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
strip = true
lto = "thin"
