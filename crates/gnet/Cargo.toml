[package]
name = "gnet"
version.workspace = true
edition.workspace = true
authors = ["GOLIA K.K."]
license = "MIT OR Apache-2.0"
description = "Secure UDP channel CLI over the in-house gnet Noise_IK stack — no external dependencies."
repository = "https://github.com/goliajp/portal"
keywords = ["gnet", "wireguard", "noise", "vpn", "cli"]
categories = ["command-line-utilities", "network-programming"]

# only in-house path crates; no crates.io dependencies.
[dependencies]
gnet-config = { path = "../gnet-config" }
gnet-crypto = { path = "../gnet-crypto" }
gnet-hex = { path = "../gnet-hex" }
gnet-noise = { path = "../gnet-noise" }
gnet-punch = { path = "../gnet-punch" }
gnet-rand = { path = "../gnet-rand" }
gnet-relay = { path = "../gnet-relay" }
gnet-tun = { path = "../gnet-tun" }
gnet-wire = { path = "../gnet-wire" }

[lints]
workspace = true
