[package]
name = "gnet-relay-server"
version.workspace = true
edition.workspace = true
authors = ["GOLIA K.K."]
license = "MIT OR Apache-2.0"
description = "Standalone relay daemon for the gnet overlay — terminates RelayData envelopes by destination pubkey and forwards opaque ciphertext to the last-known UDP endpoint of that peer. No coordinator state, no plaintext awareness. Ships an opt-in HTTP admin surface (lite) behind bearer auth."
repository = "https://github.com/goliajp/gnet"
readme = "README.md"
publish = false
keywords = ["relay", "nat-traversal", "wireguard", "overlay"]
categories = ["network-programming"]

[[bin]]
name = "gnet-relay-server"
path = "src/main.rs"

[dependencies]
gnet-wire = { workspace = true }
gnet-relay = { workspace = true }

# Admin HTTP surface (v1.1 §17.8, lite). The relay forwarder itself stays
# a single-threaded blocking std::net loop — these crates only get used
# on the admin thread, which only starts when GNET_RELAY_ADMIN_BIND is set.
# Daemon (`gnet` crate) dep tree is unaffected; this is a server-side
# binary, walled off from the overlay data plane.
gnet-hex = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Compile-time SPA embed (plan §3.4); build.rs ensures the dir exists.
include_dir = { workspace = true }

[lints]
workspace = true
