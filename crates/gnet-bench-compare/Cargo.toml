[package]
name = "gnet-bench-compare"
version.workspace = true
edition.workspace = true
authors = ["GOLIA K.K."]
license = "MIT OR Apache-2.0"
description = "Cross-ecosystem perf comparison: gnet's hand-rolled crypto stones vs. the SOTA libraries in Rust (dalek / snow / RustCrypto), Go (crypto/ecdh / crypto/mlkem), and C (libsodium). Internal-only — NOT published."
repository = "https://github.com/goliajp/portal"
publish = false

# Internal bench crate: external crypto deps are allowed here. The gnet stack
# itself stays zero-dep; this comparison shop pulls SOTA competitor libraries
# *only* to put numbers next to ours.
[dependencies]

[dev-dependencies]
gnet-crypto = { path = "../gnet-crypto" }
gnet-hex = { path = "../gnet-hex" }
gnet-noise = { path = "../gnet-noise" }
gnet-rand = { path = "../gnet-rand" }
# SOTA Rust competitors
x25519-dalek.workspace = true
chacha20poly1305.workspace = true
snow.workspace = true
ml-kem = "0.2"
rand_core = "0.6"
hex = "0.4"

[lints]
workspace = true

[[bench]]
name = "x25519"
harness = false

[[bench]]
name = "chacha20poly1305"
harness = false

[[bench]]
name = "mlkem"
harness = false

[[bench]]
name = "noise"
harness = false

[[bench]]
name = "hex"
harness = false
