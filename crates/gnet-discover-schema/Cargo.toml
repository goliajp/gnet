[package]
name = "gnet-discover-schema"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# Dispatcher-only deps — never enter the daemon's dep tree. `migrate` enables
# the embedded `Migrator`; `macros` enables `sqlx::migrate!`.
[dependencies]
sqlx = { workspace = true, features = ["macros", "migrate"] }
