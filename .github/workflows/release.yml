# gnet release pipeline.
#
# Scope: one tag → all the artifacts a downstream user might want to grab.
#   - Multi-arch Docker images on Docker Hub (goliakk/gnet:*) + ghcr
#     (ghcr.io/goliajp/gnet:*), linux/amd64 + linux/arm64.
#   - Standalone binary tarballs for mac arm64, linux x86_64, linux
#     aarch64 — uploaded as assets on the GitHub Release.
#
# Strictly separate from product CI (.github/workflows/ci.yml — quality
# gate only, never publishes) and from fleet deploy
# (scripts/deploy-fleet.sh — manual, local-only, never publishes).
#
# Triggers:
#   - Push of any tag matching `v*` (the production path; bare semver).
#   - Manual dispatch with an explicit tag input (re-run / fix-up).

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Must already exist."
        required: true

env:
  # Derive the tag name from either trigger source up-front, so every
  # job downstream can reference `env.TAG` / `env.VERSION`.
  TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  # ── 1. binaries ───────────────────────────────────────────────
  binaries:
    name: binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: install aarch64-linux cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        # gcc-aarch64-linux-gnu = cross-compiler;
        # libc6-dev-arm64-cross = the actual aarch64 libc headers + crt
        # (Scrt1.o / crti.o) that the linker needs to produce a PIE.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross
          mkdir -p .cargo
          {
            echo '[target.aarch64-unknown-linux-gnu]'
            echo 'linker = "aarch64-linux-gnu-gcc"'
          } > .cargo/config.toml

      - name: build
        run: cargo build --release -p gnet --target ${{ matrix.target }}

      - name: package
        run: |
          version="${TAG#v}"
          name="gnet-v${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/gnet" "dist/${name}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 7

  # ── 2. docker (multi-arch, two registries) ────────────────────
  docker:
    name: docker (linux/amd64 + linux/arm64 → hub + ghcr)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: derive version
        id: ver
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push (both registries, both arches)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            goliakk/gnet:${{ steps.ver.outputs.version }}
            goliakk/gnet:latest
            ghcr.io/goliajp/gnet:${{ steps.ver.outputs.version }}
            ghcr.io/goliajp/gnet:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. attach binaries to the github release ──────────────────
  release:
    name: github release
    needs: [binaries, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # only the binary tarballs we uploaded — skip the buildx-emitted
          # `.dockerbuild` summary artifact which is for the Actions UI only.
          pattern: binary-*

      - name: stage tarballs
        run: |
          mkdir -p dist
          find artifacts -name 'gnet-v*.tar.gz' -exec cp {} dist/ \;
          ls -la dist/

      - name: upload or create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If the release already exists (e.g. a re-run after a manual
          # `gh release create`), just upload assets with --clobber so a
          # retry is idempotent. Otherwise create a fresh release with
          # auto-generated notes.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists — uploading assets"
            gh release upload "$TAG" dist/*.tar.gz --clobber
          else
            echo "release $TAG does not exist — creating with auto notes"
            gh release create "$TAG" dist/*.tar.gz --generate-notes
          fi
