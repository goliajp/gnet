# gnet product CI — quality gate only.
#
# Scope: tests, lints, format. Does NOT deploy anything. Fleet
# deployment lives in `scripts/deploy-fleet.sh` (manual, local-only);
# image publishing — if/when needed — lives in
# `scripts/docker-publish.sh` (manual, local-only with operator's own
# `docker login`). These three concerns are strictly separated so a
# regression in one can never affect the others.
#
# Triggers: PR (gate the merge) + manual dispatch (operator
# convenience). No `on: push` — pushes to develop don't need a CI
# spin; the operator runs `cargo test && cargo clippy` locally before
# pushing, and `gh workflow run ci.yml` whenever a deliberate green
# check is wanted.

name: ci

on:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        # Exclude gnet-bench-compare — its perf_gate tests calibrate
        # against SOTA-competitor crates and only make sense in
        # `--release`. Running them in debug mode means the ratios are
        # wildly different (debug code is ~10× slower with explosive
        # variance) and a 2% over-cap is microbench noise, not a
        # regression. Perf work runs the gate locally in --release.
        run: cargo test --workspace --exclude gnet-bench-compare
