# Self-host docker-compose smoke test (plan §13, §15).
#
# Brings up the `self-host/` bundle on the CI runner, waits for the
# dispatcher + relay to report healthy, and verifies that:
#   - `GET /api/host-role` returns the right role on each
#   - the relay's `/api/peers` is bearer-protected (401 without,
#     200 + empty list with the right token)
#
# Runs on PRs that touch the self-host bundle, the embedded SPA, or
# the control-plane crates whose binaries the bundle builds.
# `workflow_dispatch` is on so an operator can spin it manually
# from the Actions tab without a PR.
#
# Out of scope: end-to-end daemon join (the daemon needs CAP_NET_ADMIN
# + /dev/net/tun, which the runner can't grant inside a default
# container). The join smoke is dogfooded by the internal fleet
# instead — see deploy/saas/README.md pre-flight checklist.

name: self-host-smoke

on:
  pull_request:
    paths:
      - 'self-host/**'
      - 'crates/gnet-discover/**'
      - 'crates/gnet-relay-server/**'
      - 'crates/gnet-console-schema/**'
      - 'crates/gnet-discover-schema/**'
      - 'console/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/self-host-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Write .env
        working-directory: self-host
        # Test-only values — fail the run if a real secret ever ends
        # up here.
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=ci-pg-password-not-secret
          DISPATCHER_ADMIN_TOKEN=ci-dispatcher-token-1234567890
          RELAY_ADMIN_TOKEN=ci-relay-token-1234567890123456
          RELAY_ADVERTISED_ENDPOINT=127.0.0.1:65433
          RUST_LOG=info
          EOF

      - name: Build + start stack
        working-directory: self-host
        run: |
          docker compose up -d --build --wait --wait-timeout 600
        # `--wait --wait-timeout` makes compose itself block on the
        # healthchecks defined in docker-compose.yml; if a service
        # fails to come healthy, compose exits non-zero before we
        # touch curl. Saves us re-implementing the poll loop here.

      - name: Show service status
        if: always()
        working-directory: self-host
        run: docker compose ps

      - name: Verify dispatcher host-role
        run: |
          got=$(curl -fsS http://127.0.0.1:8765/api/host-role)
          echo "dispatcher host-role: $got"
          echo "$got" | jq -e '.role == "dispatcher"' > /dev/null

      - name: Verify relay host-role
        run: |
          got=$(curl -fsS http://127.0.0.1:8766/api/host-role)
          echo "relay host-role: $got"
          echo "$got" | jq -e '.role == "relay"' > /dev/null

      - name: Verify relay /api/peers requires bearer
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8766/api/peers)
          echo "no-bearer code: $code"
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }

      - name: Verify relay /api/peers with bearer
        run: |
          got=$(curl -fsS \
            -H "Authorization: Bearer ci-relay-token-1234567890123456" \
            http://127.0.0.1:8766/api/peers)
          echo "peers: $got"
          # Empty fleet — count must be 0, peers array empty.
          echo "$got" | jq -e '.count == 0 and (.peers | length) == 0' > /dev/null

      - name: Verify relay /api/traffic with bearer
        run: |
          got=$(curl -fsS \
            -H "Authorization: Bearer ci-relay-token-1234567890123456" \
            http://127.0.0.1:8766/api/traffic)
          echo "traffic: $got"
          echo "$got" | jq -e '.peers == 0 and (.forwarded | type == "number")' > /dev/null

      - name: Collect logs on failure
        if: failure()
        working-directory: self-host
        run: |
          docker compose logs --no-color > ../self-host-docker-logs.txt 2>&1 || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: self-host-docker-logs
          path: self-host-docker-logs.txt

      - name: Tear down
        if: always()
        working-directory: self-host
        run: docker compose down -v
